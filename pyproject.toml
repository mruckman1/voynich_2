[project]
name = "voynich-2"
version = "0.1.0"
description = "Voynich manuscript stroke-level syllabary and information-theoretic fingerprinting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "ebooklib>=0.20",
    "numpy>=1.26",
    "openai>=2.24.0",
    "pymupdf>=1.27.1",
    "pypdf>=6.7.5",
    "requests>=2.32.5",
    "scipy>=1.12",
]

[project.scripts]
voynich = "voynich.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voynich"]
